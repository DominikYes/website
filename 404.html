<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Chat — Not Found</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="main">
        <section class="chat-panel">
          <div class="chat-header">
            <div>
              <p class="chat-title">Page not found</p>
              <p class="chat-subtitle">We couldn’t find that route, but your chat studio is ready.</p>
            </div>
            <div class="chip-row">
              <span class="chip">404</span>
              <span class="chip">Orbit</span>
            </div>
          </div>
          <div class="composer">
            <div class="composer-input">
              <span class="composer-icon">↩︎</span>
              <a class="ghost" href="index.html">Return to Orbit Chat</a>
            </div>
            <div class="composer-hints">
              <span>Tip: use the root URL for the main experience.</span>
              <span>Need help? Contact support.</span>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
